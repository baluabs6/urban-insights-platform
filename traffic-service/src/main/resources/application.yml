server:
  port: 8081

spring:
  application:
    name: traffic-service

  datasource:
    url: jdbc:postgresql://localhost:5432/urban_traffic
    username: ${SPRING_DATASOURCE_USERNAME:traffic_app}
    password: ${SPRING_DATASOURCE_PASSWORD:traffic_app_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    com.urban.traffic: INFO

management:
  metrics:
    tags:
      application: traffic-service
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    kafka:
      enabled: true
    show-details: always
    # ^ Spring Boot auto-registers a Kafka health indicator once spring-kafka +
    # a KafkaAdmin bean (from our NewTopic beans) are present — no custom code
    # needed. show-details:always exposes it under /actuator/health/kafka
    # (previously health only reported overall UP/DOWN, so the async pipeline
    # could be silently stalled while the service still reported healthy).
    # Trade-off: /actuator/health is intentionally unauthenticated (see
    # ApiKeyAuthFilter.PUBLIC_PATHS) for container/LB health checks, so this
    # does expose internal connectivity status to unauthenticated callers.

security:
  enabled: ${SECURITY_ENABLED:true}
  api-key: ${SECURITY_API_KEY:change-me-in-prod}
  admin-api-key: ${SECURITY_ADMIN_API_KEY:change-me-admin-in-prod}
