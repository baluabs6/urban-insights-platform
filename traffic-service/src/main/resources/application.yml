server:
  port: 8081

spring:
  application:
    name: traffic-service

  datasource:
    url: ***************
    username: ${SPRING_DATASOURCE_USERNAME:***************}
    password: ${SPRING_DATASOURCE_PASSWORD:***************}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ***************
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:***************}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    com.urban.traffic: INFO

management:
  metrics:
    tags:
      application: traffic-service
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    kafka:
      enabled: true
    show-details: always
    # ^ Spring Boot auto-registers a Kafka health indicator once spring-kafka +
    # a KafkaAdmin bean (from our NewTopic beans) are present — no custom code
    # needed. show-details:always exposes it under /actuator/health/kafka
    # (previously health only reported overall UP/DOWN, so the async pipeline
    # could be silently stalled while the service still reported healthy).
    # Trade-off: /actuator/health is intentionally unauthenticated (see
    # ApiKeyAuthFilter.PUBLIC_PATHS) for container/LB health checks, so this
    # does expose internal connectivity status to unauthenticated callers.

security:
  enabled: ${SECURITY_ENABLED:true}
  api-key: ${SECURITY_API_KEY:***************}
  admin-api-key: ${SECURITY_ADMIN_API_KEY:***************}

# Short-horizon forecasting AI module (see ForecastingService).
forecast:
  zones: ${FORECAST_ZONES:Whitefield,Koramangala,Connaught Place,Andheri}
  horizon-minutes: ${FORECAST_HORIZON_MINUTES:30}
  lookback-minutes: ${FORECAST_LOOKBACK_MINUTES:180}
  refresh-cron: "0 */10 * * * *"   # every 10 minutes
