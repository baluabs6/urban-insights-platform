version: "3.8"

services:
  # ---------- Data stores ----------
  postgres:
    image: pgvector/pgvector:pg16   # postgres:16 + the pgvector extension pre-installed
    container_name: urban_postgres
    environment:
      POSTGRES_DB: urban_traffic
      POSTGRES_USER: urban_user
      POSTGRES_PASSWORD: urban_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d

  mongodb:
    image: mongo:7
    container_name: urban_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: urban_user
      MONGO_INITDB_ROOT_PASSWORD: urban_pass
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: urban_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Single-node Kafka in KRaft mode (no Zookeeper needed) — the real-time event
  # backbone: traffic-service publishes readings/anomalies, complaint-service
  # publishes new complaints, ai-insight-service consumes both to classify
  # complaints asynchronously and keep the RAG vector index current on-write.
  kafka:
    image: bitnami/kafka:3.7
    container_name: urban_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka

  # ---------- Microservices ----------
  traffic-service:
    build:
      context: .
      dockerfile: traffic-service/Dockerfile
    container_name: traffic-service
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/urban_traffic
      SPRING_DATASOURCE_USERNAME: traffic_app
      SPRING_DATASOURCE_PASSWORD: traffic_app_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SECURITY_API_KEY: ${INTERNAL_API_KEY:-change-me-in-prod}
      SECURITY_ADMIN_API_KEY: ${INTERNAL_ADMIN_API_KEY:-change-me-admin-in-prod}

  complaint-service:
    build:
      context: .
      dockerfile: complaint-service/Dockerfile
    container_name: complaint-service
    depends_on:
      - mongodb
      - kafka
    ports:
      - "8082:8082"
    environment:
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SECURITY_API_KEY: ${INTERNAL_API_KEY:-change-me-in-prod}
      SECURITY_ADMIN_API_KEY: ${INTERNAL_ADMIN_API_KEY:-change-me-admin-in-prod}

  ai-insight-service:
    build:
      context: .
      dockerfile: ai-insight-service/Dockerfile
    container_name: ai-insight-service
    depends_on:
      - traffic-service
      - complaint-service
      - postgres
      - redis
      - kafka
    ports:
      - "8083:8083"
    environment:
      SERVICES_TRAFFIC_SERVICE_URL: http://traffic-service:8081
      SERVICES_COMPLAINT_SERVICE_URL: http://complaint-service:8082
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY:-demo-key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PGVECTOR_HOST: postgres
      PGVECTOR_PORT: 5432
      PGVECTOR_DATABASE: urban_traffic
      PGVECTOR_USER: ai_insight_app
      PGVECTOR_PASSWORD: ai_insight_app_pass
      SECURITY_API_KEY: ${INTERNAL_API_KEY:-change-me-in-prod}
      SECURITY_ADMIN_API_KEY: ${INTERNAL_ADMIN_API_KEY:-change-me-admin-in-prod}

  # ---------- Observability ----------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: urban_prometheus
    depends_on:
      - traffic-service
      - complaint-service
      - ai-insight-service
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    container_name: urban_grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      # Default local-dev credentials — change before any real deployment,
      # same as every other default secret in this project (see SecretsStartupCheck
      # for the equivalent enforcement on the app services; Grafana has no such
      # check of its own).
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
