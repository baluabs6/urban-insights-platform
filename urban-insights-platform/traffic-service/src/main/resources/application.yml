server:
  port: 8081

spring:
  application:
    name: traffic-service

  datasource:
    url: jdbc:postgresql://localhost:5432/urban_traffic
    username: urban_user
    password: urban_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

logging:
  level:
    com.urban.traffic: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
