server:
  port: 8083

spring:
  application:
    name: ai-insight-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

services:
  traffic-service:
    url: http://localhost:8081
  complaint-service:
    url: http://localhost:8082

rag:
  index-on-query-fallback: ${RAG_INDEX_ON_QUERY_FALLBACK:false}

reclassification:
  sweep-cron: 0 */15 * * * *   # every 15 minutes

city:
  zones: Whitefield,Koramangala,Connaught Place,Andheri
  briefing-cron: 0 0 7 * * *   # every day at 7:00 AM server time

sla:
  hours:
    default: 120
  check-cron: 0 0 8 * * *   # every day at 8:00 AM server time
  # Optional Slack-compatible incoming webhook URL for delivering SLA escalation
  # drafts somewhere instead of leaving them behind a GET endpoint nobody polls.
  # Leave blank to disable (default) — see README "SLA escalation delivery".
  webhook-url: ${SLA_WEBHOOK_URL:}

ai:
  openai:
    api-key: ${OPENAI_API_KEY:demo-key}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    # To use a local/open model instead (e.g. Ollama), set:
    # OPENAI_BASE_URL=http://localhost:11434/v1
    # OPENAI_MODEL=llama3
  pgvector:
    enabled: ${PGVECTOR_ENABLED:true}
    host: ${PGVECTOR_HOST:localhost}
    port: ${PGVECTOR_PORT:5432}
    database: ${PGVECTOR_DATABASE:urban_traffic}
    user: ${PGVECTOR_USER:ai_insight_app}
    password: ${PGVECTOR_PASSWORD:ai_insight_app_pass}
    table: urban_embeddings
    dimension: 1536 # matches text-embedding-3-small

logging:
  level:
    com.urban.ai: INFO

management:
  metrics:
    tags:
      application: ai-insight-service
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,prometheus
  health:
    kafka:
      enabled: true
    show-details: always

# Distributed rate limiting (Redis-backed — see DistributedRateLimiter). Replaces
# the earlier per-instance Resilience4j @RateLimiter, which silently multiplied
# its effective limit by replica count once this service scales horizontally.
ratelimit:
  rag-query:
    limit: ${RATE_LIMIT_RAG_QUERY:10}
    window-seconds: 60
  ai-endpoints:
    limit: ${RATE_LIMIT_AI_ENDPOINTS:30}
    window-seconds: 60

resilience4j:
  retry:
    instances:
      trafficService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      complaintService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      trafficService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      complaintService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

security:
  enabled: ${SECURITY_ENABLED:true}
  api-key: ${SECURITY_API_KEY:change-me-in-prod}
  admin-api-key: ${SECURITY_ADMIN_API_KEY:change-me-admin-in-prod}
