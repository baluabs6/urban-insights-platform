server:
  port: 8083

spring:
  application:
    name: ai-insight-service
  # Spring AI's pgvector VectorStore runs on a plain JDBC DataSource.
  datasource:
    url: jdbc:postgresql://${PGVECTOR_HOST:localhost}:${PGVECTOR_PORT:5432}/${PGVECTOR_DATABASE:urban_traffic}
    username: ${PGVECTOR_USER:urban_user}
    password: ${PGVECTOR_PASSWORD:urban_pass}
  http:
    client:
      connect-timeout: 5s
      read-timeout: 30s     # applies to the RestClient Spring AI uses for model calls
  ai:
    # Only the chat + embedding models are used; switch the other OpenAI model types off.
    model:
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      # Same convention as before: base URL INCLUDES /v1 (e.g. http://ollama:11434/v1 for a local model),
      # so the path overrides below drop the default /v1 prefix.
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      chat:
        completions-path: /chat/completions
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        embeddings-path: /embeddings
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        # NEW table (Spring AI schema: id uuid, content, metadata jsonb, embedding vector).
        # The old LangChain4j table "urban_embeddings" is no longer used and can be dropped.
        table-name: urban_vector_store
        dimensions: 1536      # matches text-embedding-3-small
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    mcp:
      server:
        enabled: ${MCP_SERVER_ENABLED:false}   # opt-in; endpoints require the admin API key
        name: urban-insights-mcp
        version: 1.0.0
        type: SYNC
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:***************}
      port: 6379
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:***************}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

services:
  traffic-service:
    url: ***************
  complaint-service:
    url: ***************

rag:
  index-on-query-fallback: ${RAG_INDEX_ON_QUERY_FALLBACK:false}

reclassification:
  sweep-cron: 0 */15 * * * *   # every 15 minutes

city:
  zones: Whitefield,Koramangala,Connaught Place,Andheri
  briefing-cron: 0 0 7 * * *   # every day at 7:00 AM server time

# Complaint-hotspot prediction AI module (see HotspotPredictionService).
hotspot:
  refresh-cron: "0 30 * * * *"   # hourly, offset from other scheduled jobs

sla:
  hours:
    default: 120
  check-cron: 0 0 8 * * *   # every day at 8:00 AM server time
  # Optional Slack-compatible incoming webhook URL for delivering SLA escalation
  # drafts somewhere instead of leaving them behind a GET endpoint nobody polls.
  # Leave blank to disable (default) — see README "SLA escalation delivery".
  webhook-url: ${SLA_WEBHOOK_URL:***************}

ai:
  # Kept for the optional in-memory fallback and for the chat-memory settings below.
  pgvector:
    enabled: ${PGVECTOR_ENABLED:true}
  chat-memory:
    max-messages: 20      # sliding window of recent turns sent back to the model
    ttl-hours: 24         # abandoned conversations expire from Redis after this long
  # Voice-complaint transcription backend (see VoiceTranscriptionService). Defaults
  # to OpenAI's Whisper endpoint; point at a self-hosted faster-whisper server for
  # local/offline use, same swap pattern as the chat/embedding models above.
  transcription:
    url: ${TRANSCRIPTION_URL:https://api.openai.com/v1/audio/transcriptions}
    api-key: ${TRANSCRIPTION_API_KEY:${OPENAI_API_KEY:demo-key}}
    model: ${TRANSCRIPTION_MODEL:whisper-1}

logging:
  level:
    com.urban.ai: INFO

management:
  metrics:
    tags:
      application: ai-insight-service
    distribution:
      percentiles-histogram:
        urban.llm.call: true   # backs the p99-latency panel in the Grafana LLM dashboard
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,prometheus
  health:
    kafka:
      enabled: true
    show-details: always

# Distributed rate limiting (Redis-backed — see DistributedRateLimiter). Replaces
# the earlier per-instance Resilience4j @RateLimiter, which silently multiplied
# its effective limit by replica count once this service scales horizontally.
ratelimit:
  rag-query:
    limit: ${RATE_LIMIT_RAG_QUERY:10}
    window-seconds: 60
  ai-endpoints:
    limit: ${RATE_LIMIT_AI_ENDPOINTS:30}
    window-seconds: 60

resilience4j:
  retry:
    instances:
      trafficService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
      complaintService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      trafficService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      complaintService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

security:
  enabled: ${SECURITY_ENABLED:true}
  api-key: ${SECURITY_API_KEY:***************}
  admin-api-key: ${SECURITY_ADMIN_API_KEY:***************}
